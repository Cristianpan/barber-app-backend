<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Establece tu contraseña</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
          <tr>
            <td>
              <h1 style="color: #1a1a1a; margin-bottom: 16px;">Bienvenido/a, [(${firstName})]</h1>
              <p style="color: #444444; font-size: 16px; line-height: 1.5;">
                Has sido registrado/a como empleado/a de <strong>La Navaja</strong>.
                Para acceder, primero necesitas establecer tu contraseña.
              </p>
              <p style="color: #444444; font-size: 16px; line-height: 1.5;">
                El enlace es válido por <strong>15 minutos</strong>.
              </p>
              <div style="text-align: center; margin: 32px 0;">
                <a href="[(${invitationLink})]"
                   style="background-color: #1a1a1a; color: #ffffff; text-decoration: none; padding: 14px 28px; border-radius: 6px; font-size: 16px; font-weight: bold; display: inline-block;">
                  Establecer contraseña
                </a>
              </div>
              <p style="color: #888888; font-size: 13px;">
                Si no esperabas este correo, puedes ignorarlo con seguridad.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
