spring.application.name=backend

# --- PostgreSQL datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP connection pool ---
spring.datasource.hikari.pool-name=BarberAppHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Initial ADMIN user (seeded on startup if no ADMIN exists) ---
app.initial-admin.first-name=${INITIAL_ADMIN_FIRST_NAME:}
app.initial-admin.last-names=${INITIAL_ADMIN_LAST_NAMES:}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.phone=${INITIAL_ADMIN_PHONE:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}


# --- Mail (SMTP). Defaults target the local Mailpit container (compose.yml); ---
# --- any other provider (e.g. Mailtrap) is configured only through env vars.  ---
app.mail.from=${MAIL_FROM:no-reply@barber-app.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- JWT ---
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Cookie ---
app.security.cookie-secure=${COOKIE_SECURE:false}
springdoc.swagger-ui.with-credentials=true