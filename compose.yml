services:
  postgres:
    image: postgres:16-alpine
    container_name: barber-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barber_app}
      POSTGRES_USER: ${POSTGRES_USER:-barber_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barber_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barber_app} -d ${POSTGRES_DB:-barber_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: barber-app-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025

volumes:
  postgres_data:
